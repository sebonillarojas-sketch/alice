<text x="90" y="26" font-size="15" fill="#111" font-weight="700">2026-08-06-u01 — 33.5 m² — 1D/1B lote interior con pozo lateral corrido — Pueblo Libre, Lima Moderna</text>
<text x="90" y="46" font-size="12" fill="#555">BRIEF TERRENO: lote interior de edificio multifamiliar (sin fachada a calle) — frente 5.10 m × fondo 7.20 m.</text>
<text x="90" y="66" font-size="12" fill="#555">Única fachada libre: pozo de luz lateral corrido en el lado Este, 2.20 m de ancho × 7.20 m de largo (multifamiliar ≥ 2.10 m, RNE A.020 Art. 11.4.b), compartido en espejo con la unidad vecina.</text>
<text x="90" y="86" font-size="12" fill="#555">Ingreso por el lado corto superior del plano: pasillo común techado del edificio, medianero/interior ciego, solo puerta de acceso, sin ventanas. El lado izquierdo (Oeste) y el inferior (Sur) son medianeros ciegos con unidades vecinas.</text>
<text x="90" y="106" font-size="12" fill="#555">Orientación: pozo hacia el Este — sol de mañana entra a sala y dormitorio. Retiros: ninguno (edificación entre medianeras). Segmento: 1D compacto de inversión.</text>
