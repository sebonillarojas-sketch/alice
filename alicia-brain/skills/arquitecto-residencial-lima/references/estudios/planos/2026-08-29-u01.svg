<text x="90" y="22" font-size="15" font-weight="bold" fill="#111">2026-08-29 (u01) — 52.92 m² — 1D/1B amplio, patio de recibo de pasaje de quinta — San Miguel, Lima Moderna</text>
<text x="90" y="37" font-size="10.5" font-weight="normal" fill="#111">BRIEF: lote al fondo de una quinta (subdivisión con pasaje común), sin frente propio a la calle pública. Acceso por un pasaje de 1.20 m (sirve hasta 4 viviendas, RNE A.010) que remata en un patio de recibo de la unidad. Frente 8.40 x fondo 6.30.</text>
<text x="90" y="49" font-size="10.5" font-weight="normal" fill="#111">Parti: la fachada viva de hoy es ese patio de recibo, no la calle. Sala-comedor + dormitorio principal + terraza ganan el 100% del frente (mampara amplia); cocina americana en la sala. Vestidor+baño (suite/visita) como colchón entre dormitorio y el resto; lavandería y depósito al fondo contra un pozo posterior de 7.60 m de ancho.</text>
<text x="90" y="61" font-size="10.5" font-weight="normal" fill="#111">Segmento: 1D/1B amplio, retiro frontal 0 m (alineado al patio interno de la quinta).</text>
