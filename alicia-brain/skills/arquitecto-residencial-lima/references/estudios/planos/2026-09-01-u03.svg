<svg xmlns="http://www.w3.org/2000/svg" width="960" height="919" viewBox="0 0 960 919" font-family="Arial, sans-serif">
<rect width="960" height="919" fill="white"/>
<text x="20" y="26" font-size="17" font-weight="bold">2026-09-01 (u03) — 3D/2B fachada única profunda, espina húmeda + pozo lateral — La Molina, Lima Top</text>
<text x="20" y="41" font-size="11.5" fill="#333">BRIEF: lote de fachada única profunda (frente 7.80 m x fondo 10.80 m), medianeros a ambos lados; retiro posterior descubierto</text>
<text x="20" y="56" font-size="11.5" fill="#333">7.80x1.70 (pozo, ancho ≥6 m) + pozo lateral corrido de 2.10 m contra el medianero derecho (dormitorio 2 y 3 ventilan ahí).</text>
<text x="20" y="71" font-size="11.5" fill="#333">TEMA DE HOY (muro húmedo/núcleos de servicio, 3ra vuelta): el eje húmedo (vestidor+baño ppal+cocina+baño 2, x=3.00,</text>
<text x="20" y="86" font-size="11.5" fill="#333">y=3.80 a 10.80) es una espina vertical única que reparte ancho por función real: vestidor+baño ppal (2.80 m, suite) &gt;&gt;</text>
<text x="20" y="101" font-size="11.5" fill="#333">cocina (1.45 m) ≈ baño 2 (1.45 m). La cocina queda SIN ventana propia (pierde la pugna por el único paño con pozo</text>
<text x="20" y="116" font-size="11.5" fill="#333">frente al baño 2, que sí la necesita por norma) y ventila por ducto de instalaciones sanitarias (RNE IS.010) — se prioriza</text>
<text x="20" y="131" font-size="11.5" fill="#333">el baño, no la cocina, cuando compiten por el mismo paño de pozo.</text>
<text x="20" y="146" font-size="11.5" fill="#333">Parti: terraza+sala-comedor+dormitorio principal ganan el frente; hall real toca dormitorio 2, baño 2 y dormitorio 3</text>
<text x="20" y="161" font-size="11.5" fill="#333">(ningún dormitorio depende de la terraza); enfilade dormitorio principal→vestidor→baño principal.</text>
<text x="20" y="176" font-size="11.5" fill="#333">Segmento: 3D/2B amplio, La Molina, Lima Top.</text>
