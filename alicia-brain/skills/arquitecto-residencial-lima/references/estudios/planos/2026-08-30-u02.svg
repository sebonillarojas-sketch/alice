<text x="20" y="26" font-size="17" font-weight="bold">2026-08-30 (u02) — 76.68 m² — 2D/2B esquina real NORTE+ESTE — Jesús María, Lima Moderna-Top</text>
<text x="20" y="44" font-size="11.5" fill="#333">BRIEF: lote esquina, frente norte 10.65 m + frente este (lateral) 7.20 m, medianeros sur y oeste.</text>
<text x="20" y="59" font-size="11.5" fill="#333">Parti: sala-comedor ocupa el vértice tocando AMBAS fachadas reales; terraza mordida en la propia fachada segunda de la sala (corrección de</text>
<text x="20" y="74" font-size="11.5" fill="#333">Sebastián), no relegada a otro ambiente. Cocina abierta ≥5 m² con lavandería integrada, sin depósito.</text>
<text x="20" y="89" font-size="11.5" fill="#333">Segmento: 2D/2B esquina, Lima Moderna-Top.</text>
