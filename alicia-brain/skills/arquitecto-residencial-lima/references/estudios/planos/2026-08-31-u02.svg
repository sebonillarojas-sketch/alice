<text x="20" y="26" font-size="17" font-weight="bold">2026-08-31 (u02) — 2D/2B esquina NORTE+ESTE — Surquillo/Jesús María, Lima Moderna-Top</text>
<text x="20" y="44" font-size="11.5" fill="#333">BRIEF: lote esquina, frente norte 11.40 m + frente este (lateral) 6.95 m, medianeros sur y oeste.</text>
<text x="20" y="59" font-size="11.5" fill="#333">MATRIZ DE RELACIONES: sala ESENCIAL con terraza/cocina/hall; dormitorio 2 y baño 2 DESEABLE entre sí pero servidos</text>
<text x="20" y="74" font-size="11.5" fill="#333">por hall (no enfilade: dos piezas necesitan acceso independiente, no una secuencia de un solo uso).</text>
<text x="20" y="89" font-size="11.5" fill="#333">Parti: terraza muerde la fachada segunda de la sala (nunca al fondo). ENFILADE recta dormitorio principal→vestidor→</text>
<text x="20" y="104" font-size="11.5" fill="#333">baño principal (mismo eje y, cero pasillo real para la suite); hall real toca dormitorio 2 y baño 2 con puerta directa.</text>
<text x="20" y="119" font-size="11.5" fill="#333">Segmento: 2D/2B esquina, Lima Moderna-Top.</text>
