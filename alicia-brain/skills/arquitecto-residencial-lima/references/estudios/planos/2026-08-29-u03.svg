<text x="90" y="22" font-size="15" font-weight="bold" fill="#111">2026-08-29 (u03) — 117.04 m² — 3D/2B fachada única profunda, fondo de lote de pasaje — La Molina, Lima Top</text>
<text x="90" y="37" font-size="10.5" font-weight="normal" fill="#111">BRIEF: lote profundo al fondo de un pasaje privado de acceso (sin frente a calle pública); medianeros a ambos lados. Frente 13.225 x fondo 8.85.</text>
<text x="90" y="49" font-size="10.5" font-weight="normal" fill="#111">Parti: sala-comedor + terraza ganan el 100% del frente contra el patio de recibo del pasaje (cero dormitorio al frente, corrección de Sebastián). Eje húmedo lateral (cocina+lavandería+baño 1+baño visita) contra un muro húmedo único; hall reparte los 3 dormitorios contra el pozo posterior sin cruzarse entre sí. Baño 1 adyacente a los 3 dormitorios (no en suite, por muro húmedo único) + baño visita independiente desde la sala.</text>
<text x="90" y="61" font-size="10.5" font-weight="normal" fill="#111">Segmento: 3D/2B, Lima Top.</text>
