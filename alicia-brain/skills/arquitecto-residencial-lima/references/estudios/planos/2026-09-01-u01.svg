<text x="20" y="26" font-size="17" font-weight="bold">2026-09-01 (u01) — 1D/1B amplio, fachada única frente ancho — Surco, Lima Moderna</text>
<text x="20" y="41" font-size="11.5" fill="#333">BRIEF: lote entre medianeros, frente 8.30 m x fondo 6.60 m + retiro posterior descubierto 8.30x1.70 (pozo, ancho ≥6 m).</text>
<text x="20" y="56" font-size="11.5" fill="#333">TEMA DE HOY (muro húmedo/núcleos de servicio, 3ra vuelta): el muro húmedo corre TODO el fondo (y=6.60, contra el pozo) y</text>
<text x="20" y="71" font-size="11.5" fill="#333">reparte su ancho por función real, no en franjas iguales — cocina+lavandero (10.1 m², la pieza más grande) &gt;&gt; baño en</text>
<text x="20" y="86" font-size="11.5" fill="#333">suite (4.0 m²) &gt;&gt; hall distribuidor (2.9 m²). Cocina y baño ventilan directo al pozo (2do frente vivo de la unidad).</text>
<text x="20" y="101" font-size="11.5" fill="#333">Parti: enfilade dormitorio→vestidor→baño en suite; baño con 2do acceso de visita vía hall sin cruzar dormitorio ni cocina.</text>
<text x="20" y="116" font-size="11.5" fill="#333">Segmento: 1D/1B amplio, Surco, Lima Moderna.</text>
