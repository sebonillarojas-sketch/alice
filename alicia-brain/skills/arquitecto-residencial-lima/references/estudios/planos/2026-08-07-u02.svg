<text x="90" y="66" font-size="12" fill="#555">Corner dual-aspect: sala-comedor en L abraza la terraza en el vértice, tomando luz de ambos frentes; dormitorio principal y dormitorio 2 ocupan cada uno un frente distinto.</text>
