<text x="90" y="66" font-size="12" fill="#555">Dos fachadas libres a lo largo de TODO el lado, no solo en el vértice: Norte (avenida, sol de mediodía) y Oeste (calle secundaria) — cualquier ambiente que toque cualquiera de los dos lados recibe luz directa. Medianeros ciegos al Este y al Sur.</text>
<text x="90" y="86" font-size="12" fill="#555">Retiro frontal 3.00 m (avenida) y lateral 2.00 m (calle secundaria), normativa de esquina Lima Top (no dibujados, aplican al lote mayor, no a la huella de la unidad). Sin pozo: no se necesita, las dos fachadas cubren los 3 dormitorios y la sala.</text>
