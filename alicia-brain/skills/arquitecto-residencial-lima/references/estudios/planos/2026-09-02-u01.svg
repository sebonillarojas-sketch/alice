<text x="20" y="26" font-size="17" font-weight="bold" fill="#000">2026-09-02 (u01) — 1D/1B amplio, fachada única frente ancho — Magdalena del Mar, Lima Moderna</text>
<text x="20" y="47" font-size="11.5" fill="#333">BRIEF: lote entre medianeros, frente 7.60 x fondo 6.20 m, fachada única (frente ancho), sin pozo (fondo dentro de la crujía iluminable).</text>
<text x="20" y="62.5" font-size="11.5" fill="#333">TEMA DE HOY (flexibilidad/desjerarquización, 3ra vuelta): cocina abierta con lavadero (10.10 m²) VISIBLE, conectada a la sala por apertura</text>
<text x="20" y="78.0" font-size="11.5" fill="#333">ancha (1.20 m, sin hoja) — el trabajo doméstico no queda oculto tras un pasillo de servicio (regla 116).</text>
<text x="20" y="93.5" font-size="11.5" fill="#333">Parti: enfilade dormitorio→vestidor→baño en suite. Segmento: 1D/1B amplio, Magdalena del Mar, Lima Moderna.</text>
