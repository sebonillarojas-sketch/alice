<text x="20" y="26" font-size="17" font-weight="bold">2026-08-31 (u01) — 1D/1B amplio, fachada única frente ancho — Pueblo Libre, Lima Moderna</text>
<text x="20" y="44" font-size="11.5" fill="#333">BRIEF: lote entre medianeros, frente 8.35 m x fondo 6.50 m + retiro posterior descubierto 8.35x1.60 (pozo, ancho ≥6 m).</text>
<text x="20" y="59" font-size="11.5" fill="#333">MATRIZ DE RELACIONES (Paso 0 de hoy): sala-comedor ESENCIAL con cocina/terraza/dormitorio; baño ESENCIAL con vestidor,</text>
<text x="20" y="74" font-size="11.5" fill="#333">DESEABLE con hall, INDESEABLE con sala directa (por eso llega vía vestidor o hall, nunca puerta directa desde sala).</text>
<text x="20" y="89" font-size="11.5" fill="#333">Parti: ENFILADE recta dormitorio principal→vestidor→baño 1 (mismo eje x, puertas alineadas, cero jog) para el acceso en</text>
<text x="20" y="104" font-size="11.5" fill="#333">suite; baño con 2do acceso de visita vía hall sin cruzar dormitorio ni cocina. Cocina abierta con lavandero integrado.</text>
<text x="20" y="119" font-size="11.5" fill="#333">Segmento: 1D/1B amplio, Lima Moderna.</text>
