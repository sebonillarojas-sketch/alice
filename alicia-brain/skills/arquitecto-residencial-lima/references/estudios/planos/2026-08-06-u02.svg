<text x="90" y="26" font-size="15" fill="#111" font-weight="700">2026-08-06-u02 — 54.0 m² — 2D/2B fachada única frente ancho — Lince, Lima Moderna</text>
<text x="90" y="46" font-size="12" fill="#555">BRIEF TERRENO: lote entre medianeras (edificación continua), frente 9.60 m × fondo 6.20 m.</text>
<text x="90" y="66" font-size="12" fill="#555">Única fachada libre: el frente (Este, hacia la calle). Los tres lados restantes (Oeste, Norte y Sur) son medianeros ciegos con lotes vecinos — no hay pozo declarado, no se necesita: la profundidad de 6.20 m cabe dentro de la crujía iluminable (5.5–6.5 m) resuelta en una sola banda.</text>
<text x="90" y="86" font-size="12" fill="#555">Orientación: fachada al Este — sol de mañana en sala y ambos dormitorios (los tres comparten el frente). Sin retiro frontal (alineamiento a vereda, Lima Moderna); retiros laterales 0 m (medianero).</text>
<text x="90" y="106" font-size="12" fill="#555">Segmento: 2D/2B estándar de mercado.</text>
