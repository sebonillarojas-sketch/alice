<text x="20" y="26" font-size="17" font-weight="bold" fill="#000">2026-09-02 (u02) — 2D/2B esquina real, dormitorios equivalentes — Barranco, Lima Moderna</text>
<text x="20" y="47" font-size="11.5" fill="#333">BRIEF: lote esquina (dos fachadas vivas: calle x=0 y calle y=0), frente 8.20 x fondo 9.65 m, medianeros a la derecha y al fondo.</text>
<text x="20" y="62.5" font-size="11.5" fill="#333">TEMA DE HOY (flexibilidad/desjerarquización, 3ra vuelta): dormitorio principal y dormitorio 2 diseñados con área CASI IGUAL (9.68 m² cada</text>
<text x="20" y="78.0" font-size="11.5" fill="#333">uno) — la jerarquía se marca solo por el baño en suite, no por el tamaño de la pieza, habilitando reasignar roles familiares (regla 114).</text>
<text x="20" y="93.5" font-size="11.5" fill="#333">Parti: sala en el vértice, dormitorios en cada fachada, núcleo húmedo en un solo eje vertical (x=3.30). Segmento: 2D/2B, Barranco.</text>
