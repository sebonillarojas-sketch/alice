<text x="90" y="26" font-size="15" fill="#111" font-weight="700">2026-08-08-u01 (D4) — 46.20 m² — 1D/1B fachada única, eje húmedo posterior único — San Miguel, Lima Moderna</text>
<text x="90" y="46" font-size="12" fill="#555">BRIEF TERRENO: lote interior entre medianeros (izquierda, derecha y fondo), edificio de 3 pisos repetido en planta. Frente 6.60 m orientado al ESTE (sol de mañana), fondo techado 7.00 m.</text>
<text x="90" y="66" font-size="12" fill="#555">Parti: sala y dormitorio comparten el frente (banda iluminada); vestidor integrado al dormitorio como alcoba en el mismo ambiente (sin pasillo).</text>
<text x="90" y="86" font-size="12" fill="#555">Eje húmedo único horizontal (cocina+lavandería+baño en suite) contra un solo muro, apilable sin cambios entre los 3 niveles del edificio; terraza de servicio corrida al fondo.</text>
<text x="90" y="106" font-size="12" fill="#555">Segmento: 1D/1B amplio de mercado, retiro frontal 0 m (alineado a vereda).</text>
