<text x="90" y="26" font-size="15" fill="#111" font-weight="700">2026-08-08-u02 (D4) — 79.56 m² — 2D/2B esquina, eje húmedo en espina única — Surco, Lima Top</text>
<text x="90" y="46" font-size="12" fill="#555">BRIEF TERRENO: lote esquinero con dos fachadas reales corridas (ESTE y NORTE), medianero en los otros dos lados. Frente 7.80 m (Este) x fondo 10.20 m (Norte).</text>
<text x="90" y="66" font-size="12" fill="#555">Parti: sala-comedor ocupa el vértice con doble fachada (dual-aspecto); dormitorio 2 y dormitorio principal reciben cada uno su propio frente.</text>
<text x="90" y="86" font-size="12" fill="#555">Eje húmedo único vertical (espina) que apila cocina + lavandería + baño 2 + baño en suite de punta a punta — un solo ducto de instalaciones húmedas, separado del ducto eléctrico, replicable en cada piso del edificio.</text>
<text x="90" y="106" font-size="12" fill="#555">Dormitorio principal con vestidor propio (buffer acústico) y terraza privada al fondo.</text>
