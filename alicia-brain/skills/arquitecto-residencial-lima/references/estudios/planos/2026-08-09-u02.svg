<text x="90" y="26" font-size="15" fill="#111" font-weight="700">2026-08-09-u02 (D5) — 69.60 m² — 2D/2B esquina, fachada de cuatro piezas — Surquillo/Jesús María, Lima Moderna-Top</text>
<text x="90" y="46" font-size="12" fill="#555">BRIEF TERRENO: lote esquinero, dos fachadas reales corridas (Norte y Este). Frente 11.60 m (Norte) x fondo 6.00 m (Este).</text>
<text x="90" y="66" font-size="12" fill="#555">Corrección aplicada (Sebastián, c3): dormitorio 2 se mantiene bien ubicado; dormitorio principal se movió a la derecha, sobre la segunda fachada real. Terraza generosa junto a la sala, en la fachada.</text>
<text x="90" y="86" font-size="12" fill="#555">Terraza actúa de distribuidor público: exterior→terraza→{sala, dormitorio principal, baño 2}. Baño 2 (sirve a dormitorio 2 y de visita) se alcanza SIN cruzar la cocina — antes ese cruce generaba flujo incorrecto y espacio residual.</text>
<text x="90" y="106" font-size="12" fill="#555">Cocina y lavandería pegadas (siempre funciona). Dormitorio principal con vestidor + baño en suite (zona buffer).</text>
