<text x="90" y="66" font-size="12" fill="#555">Corner dual-aspect: sala-comedor en el vértice con terraza mordida; los tres dormitorios se alinean sobre la única fachada Oeste, servidos por un pasillo vertical de 0.90 m (6.6% de circulación).</text>
<text x="90" y="86" font-size="12" fill="#555">Orientación: frente Norte + lateral Oeste con luz de tarde en los tres dormitorios. Retiro frontal 3.00 m (La Molina, típico unifamiliar); retiros de medianero 0 m.</text>
<text x="90" y="106" font-size="12" fill="#555">Segmento: 3D/2B amplio Lima Top (p75 del 3D), 85.0 m². Principal en suite con vestidor propio; baño 2 sirve a dormitorio 2, 3 y visita sin atravesar ningún dormitorio.</text>
