<text x="20" y="26" font-size="17" font-weight="bold">2026-08-30 (u03) — 112.32 m² — 3D/2B fachada única profunda — La Molina, Lima Top</text>
<text x="20" y="44" font-size="11.5" fill="#333">BRIEF: lote interior profundo, medianeros a ambos lados, frente único 9.60 m, fondo techado 11.70 m + pozo posterior 9.60×2.00 m (sin techar, más</text>
<text x="20" y="59" font-size="11.5" fill="#333">allá del muro de fondo, no es ambiente del JSON).</text>
<text x="20" y="74" font-size="11.5" fill="#333">Parti: terraza al frente junto a la sala (nunca al fondo) y servicios al fondo (corrección de Sebastián). Hall de ANCHO COMPLETO que toca</text>
<text x="20" y="89" font-size="11.5" fill="#333">físicamente los 3 dormitorios (corrige la puerta fantasma del día 25: ningún dormitorio depende solo de la terraza). Baño principal + baño</text>
<text x="20" y="104" font-size="11.5" fill="#333">compartido — dos baños reales para 3 dormitorios, no uno solo.</text>
<text x="20" y="119" font-size="11.5" fill="#333">Segmento: 3D/2B, Lima Top.</text>
