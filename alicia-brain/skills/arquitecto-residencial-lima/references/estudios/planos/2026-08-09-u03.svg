<text x="90" y="26" font-size="15" fill="#111" font-weight="700">2026-08-09-u03 (D5) — 91.84 m² — 3D/3B fachada única profunda — Pueblo Libre/La Molina, Lima Top</text>
<text x="90" y="46" font-size="12" fill="#555">BRIEF TERRENO: lote interior de manzana, fachada única al frente, pozo lateral corrido de 2.20 m en el lindero izquierdo (servidumbre RNE Art. 11.4.b, ilumina dormitorio 3) y pozo posterior de 2.20 m en el fondo (ilumina dormitorio principal y dormitorio 2). Frente 8.20 m x fondo 11.20 m.</text>
<text x="90" y="66" font-size="12" fill="#555">Corrección aplicada (Sebastián, c4): el paquete frontal es SOLO social — sala-comedor y terraza — sin ningún dormitorio; los tres dormitorios van atrás, con ventilación real (pozo lateral y posterior). Se agregó un baño de visita propio junto a la sala. Hall corto (único pasillo justificado, 3+ piezas íntimas) reparte a los tres dormitorios y al baño compartido, sin cruzar ningún dormitorio para llegar a él.</text>
<text x="90" y="86" font-size="12" fill="#555">Cocina y lavandería pegadas, muro húmedo único en la franja de servicios.</text>
