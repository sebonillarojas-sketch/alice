<text x="90" y="26" font-size="15" fill="#111" font-weight="700">2026-08-09-u01 (D5) — 52.80 m² — 1D/1B amplio, fachada de tres piezas — San Isidro/Surco, Lima Top</text>
<text x="90" y="46" font-size="12" fill="#555">BRIEF TERRENO: lote interior de manzana, medianero a ambos lados y al fondo, fachada única al ESTE (sol de mañana). Frente 8.00 m x fondo 6.60 m.</text>
<text x="90" y="66" font-size="12" fill="#555">Corrección aplicada (Sebastián, c2): nunca ventana y puerta de ingreso juntas; el frente nunca es muro ciego. Entrada por la terraza (sin ventana propia); dormitorio principal y sala tienen SU PROPIA ventana al frente, lejos de la puerta.</text>
<text x="90" y="86" font-size="12" fill="#555">Terraza como elemento de fachada y distribuidor: exterior→terraza→{sala, dormitorio principal, baño 1}. Baño con doble acceso (vestidor privado + terraza pública) sirve de en-suite y no obliga a la visita a cruzar el dormitorio.</text>
<text x="90" y="106" font-size="12" fill="#555">Cocina generosa (5.0 m², no kitchenette forzada) y lavandería al fondo, menos vistosa, pegada a la cocina.</text>
