<text x="90" y="22" font-size="15" font-weight="bold" fill="#111">2026-08-29 (u02) — 108.36 m² — 2D/2B esquina de pasaje (vértice interior de una quinta) — Jesús María, Lima Moderna</text>
<text x="90" y="37" font-size="10.5" font-weight="normal" fill="#111">BRIEF: unidad en el vértice donde el pasaje principal de la quinta remata contra un segundo tramo lateral: dos fachadas reales (x=0 el corredor de acceso, x=frente el remate del pasaje), ninguna da a la calle pública. Frente 11.60 x fondo 8.60.</text>
<text x="90" y="49" font-size="10.5" font-weight="normal" fill="#111">Parti: dormitorio principal (suite+vestidor) y sala-comedor ganan la fachada del corredor; terraza y dormitorio 2 ganan la fachada del remate (esquina real dentro de la quinta). Cocina+lavandería pegadas y accesibles desde la sala; baño 2 vía hall sin cruzar dormitorios.</text>
<text x="90" y="61" font-size="10.5" font-weight="normal" fill="#111">Segmento: 2D/2B, Lima Top dentro de una quinta consolidada.</text>
