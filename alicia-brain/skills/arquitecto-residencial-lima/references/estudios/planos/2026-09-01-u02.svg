<svg xmlns="http://www.w3.org/2000/svg" width="886" height="685" viewBox="0 0 886 685" font-family="Arial, sans-serif">
<rect width="886" height="685" fill="white"/>
<text x="20" y="26" font-size="17" font-weight="bold">2026-09-01 (u02) — 2D/2B esquina real, dos fachadas vivas — Miraflores/San Isidro, Lima Top</text>
<text x="20" y="41" font-size="11.5" fill="#333">BRIEF: lote de esquina real (frente 10.60 m x fondo 7.40 m) con DOS fachadas vivas: calle principal (y=0) y calle lateral</text>
<text x="20" y="56" font-size="11.5" fill="#333">(x=10.60, remate de esquina) + retiro posterior descubierto 10.60x1.80 (pozo, ancho ≥6 m, y también ventila el núcleo húmedo).</text>
<text x="20" y="71" font-size="11.5" fill="#333">TEMA DE HOY (muro húmedo/núcleos de servicio, 3ra vuelta): el vértice de las dos fachadas vivas es 100% social/dormitorios;</text>
<text x="20" y="86" font-size="11.5" fill="#333">el núcleo húmedo (baño principal+cocina+baño 2, 16.1 m²) se compacta en la franja SIN ninguna fachada viva propia, entre</text>
<text x="20" y="101" font-size="11.5" fill="#333">los dos dormitorios, ventilando solo por el pozo trasero — ancho por función real: cocina(2.1)&gt;baño(1.0)&gt;baño2(1.0)&gt;hall(1.0).</text>
<text x="20" y="116" font-size="11.5" fill="#333">Parti: sala-comedor gana el vértice; terraza en la fachada segunda (calle lateral) junto a la sala; dormitorio 2 hereda esa</text>
<text x="20" y="131" font-size="11.5" fill="#333">misma fachada lateral más abajo. Enfilade dormitorio ppal→vestidor→baño ppal; baño 2 y dormitorio 2 cuelgan del hall.</text>
<text x="20" y="146" font-size="11.5" fill="#333">Segmento: 2D/2B, Miraflores/San Isidro, Lima Top.</text>
