<text x="20" y="26" font-size="17" font-weight="bold" fill="#000">2026-09-02 (u03) — 3D/2B esquina real, dormitorios secundarios equivalentes — La Molina, Lima Top</text>
<text x="20" y="47" font-size="11.5" fill="#333">BRIEF: lote esquina (dos fachadas vivas: calle x=0 y calle y=0), frente 7.40 x fondo 13.25 m, medianeros a la derecha y al fondo.</text>
<text x="20" y="62.5" font-size="11.5" fill="#333">TEMA DE HOY (flexibilidad/desjerarquización, 3ra vuelta): dormitorio 2 y dormitorio 3 diseñados con área IDÉNTICA (11.59 m² cada uno) —</text>
<text x="20" y="78.0" font-size="11.5" fill="#333">ningún hijo/adulto tiene la pieza "chica", habilitando reasignar roles familiares sin remodelar (regla 114). Pasillo interior evita que</text>
<text x="20" y="93.5" font-size="11.5" fill="#333">dormitorio 3 dependa de la terraza para su acceso (corrección c9). Núcleo húmedo en un solo eje vertical contra el medianero derecho.</text>
