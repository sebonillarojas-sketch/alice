<text x="90" y="26" font-size="15" fill="#111" font-weight="700">2026-08-08-u03 (D4) — 104.38 m² — 3D/2B fachada única profunda, eje húmedo junto al pasillo — La Molina, Lima Top</text>
<text x="90" y="46" font-size="12" fill="#555">BRIEF TERRENO: lote interior entre medianeros, frente único orientado al ESTE. Frente 8.35 m x fondo techado 12.50 m. Pozo posterior real de 8.35 x 6.00 m (excede el mínimo de 6 m en una dimensión) ilumina dormitorio 3 y dormitorio principal.</text>
<text x="90" y="66" font-size="12" fill="#555">Parti: sala al frente, pasillo corto y justificado (bloque íntimo de 3 dormitorios + baño en suite, no cabe alrededor de la sala sin pasillo — 7.9% de circulación, dentro del 10% permitido).</text>
<text x="90" y="86" font-size="12" fill="#555">Eje húmedo horizontal único, junto al pasillo, que sirve cocina+lavandería+baño 2 (fila superior) y baño en suite (fila inferior) con un solo muro húmedo continuo.</text>
<text x="90" y="106" font-size="12" fill="#555">Dormitorio principal en suite con vestidor propio; solo 2 baños en total (no se triplican baños pese a 3 dormitorios).</text>
