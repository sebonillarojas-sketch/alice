<text x="20" y="26" font-size="17" font-weight="bold">2026-08-31 (u03) — 3D/2B fachada única de frente amplio — La Molina/Surco, Lima Top</text>
<text x="20" y="44" font-size="11.5" fill="#333">BRIEF: lote entre medianeros, frente 15.30 m x fondo 8.00 m + retiro posterior descubierto 15.30x2.20 (pozo, ancho ≥6 m).</text>
<text x="20" y="59" font-size="11.5" fill="#333">MATRIZ DE RELACIONES: hall ESENCIAL con los 3 dormitorios y baño 2 (hub verificado por adyacencia real, no solo por</text>
<text x="20" y="74" font-size="11.5" fill="#333">la lista de puertas); dormitorio principal ESENCIAL con vestidor/baño principal pero INDESEABLE su acceso directo</text>
<text x="20" y="89" font-size="11.5" fill="#333">desde el hall (privacidad de la suite) — de ahí la ENFILADE horizontal dormitorio principal→vestidor→baño principal.</text>
<text x="20" y="104" font-size="11.5" fill="#333">Terraza al frente junto a la sala, servicios y dormitorios al fondo; ningún dormitorio depende solo de la terraza.</text>
<text x="20" y="119" font-size="11.5" fill="#333">Segmento: 3D/2B fachada única, Lima Top.</text>
